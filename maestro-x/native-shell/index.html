<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maestro X</title>
<style>
html,body{margin:0;height:100%;background:#070707;color:#fff;font-family:-apple-system,system-ui,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.logo{font-weight:900;letter-spacing:.12em;font-size:28px}.x{color:#E3120B;display:inline-block;transform:skewX(-12deg);text-shadow:0 0 14px rgba(255,59,48,.75)}
p{color:#8C8C8C;max-width:320px;line-height:1.5}
button{background:#E3120B;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-weight:800;font-size:16px}
</style></head>
<body><main>
<div class="logo">MAESTRO <span class="x">X</span></div>
<p>No internet connection. Connect to Wi-Fi or data and try again.<br><br>Sin conexión a internet. Conéctate y vuelve a intentarlo.</p>
<button onclick="location.href='https://maestro-x.vercel.app'">Retry / Reintentar</button>
</main></body></html>
